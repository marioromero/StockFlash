name: CI StockFlash PHP/Node

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  php:
    name: PHP 8.3 test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: "8.3"
          extensions: mbstring, dom, xml, pdo_sqlite, fileinfo
          coverage: none
      - name: Validate composer
        run: composer validate --no-check-publish --no-check-all --strict
      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist
      - name: Run PHP tests
        run: php artisan test

  node:
    name: Node 24 typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  smoke:
    name: Smoke GET / es-CL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [php, node]
    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: "8.3"
          extensions: mbstring, dom, xml, pdo_sqlite, fileinfo
          coverage: none
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist
      - name: Install Node dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Serve and check GET /
        shell: bash
        run: |
          set -euo pipefail
          PORT=18733
          php artisan serve --host=127.0.0.1 --port="$PORT" >/tmp/sf-smoke.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; wait "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/" -o /tmp/sf-smoke.html; then
              break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "Smoke FAIL: sin respuesta HTTP en 60s"
              cat /tmp/sf-smoke.log || true
              exit 1
            fi
          done
          STATUS=$(curl -s -o /tmp/sf-smoke.html -w "%{http_code}" "http://127.0.0.1:${PORT}/")
          if [ "$STATUS" != "200" ]; then
            echo "Smoke FAIL: HTTP $STATUS (esperado 200)"
            exit 1
          fi
          if ! grep -q 'lang="es-CL"' /tmp/sf-smoke.html; then
            echo "Smoke FAIL: falta lang es-CL"
            exit 1
          fi
          if ! grep -q -E 'StockFlash|/assets/|@inertia|__app|data-page' /tmp/sf-smoke.html; then
            echo "Smoke FAIL: sin referencia a la aplicacion Vue/Inertia"
            exit 1
          fi
          DOCS_STATUS=$(curl -s -o /tmp/sf-docs.html -w "%{http_code}" "http://127.0.0.1:${PORT}/docs/")
          if [ "$DOCS_STATUS" != "200" ]; then
            echo "Smoke FAIL: /docs/ HTTP $DOCS_STATUS (esperado 200)"
            exit 1
          fi
          if ! grep -q 'id="search"' /tmp/sf-docs.html || ! grep -q 'topics-nav' /tmp/sf-docs.html; then
            echo "Smoke FAIL: /docs/ sin buscador o menu lateral"
            exit 1
          fi
          ROADMAP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${PORT}/roadmap")
          if [ "$ROADMAP_STATUS" = "200" ]; then
            echo "Smoke FAIL: /roadmap expuesto publicamente (200)"
            exit 1
          fi
          if [ "$ROADMAP_STATUS" != "302" ] && [ "$ROADMAP_STATUS" != "403" ]; then
            echo "Smoke FAIL: /roadmap respuesta inesperada ($ROADMAP_STATUS)"
            exit 1
          fi
          echo "Smoke OK: HTTP 200 + lang es-CL + /docs/ 200 + /roadmap protegido ($ROADMAP_STATUS)"
