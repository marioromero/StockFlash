name: Verify StockFlash contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: DOC contracts and hashes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify contract consistency
        run: python3 scripts/check_contracts.py
