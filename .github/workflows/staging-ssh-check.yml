name: Verify staging SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify host fingerprint and SSH authentication
        shell: bash
        env:
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          SSH_USER: ${{ vars.STAGING_SSH_USER }}
          SSH_FINGERPRINT: ${{ vars.STAGING_SSH_FINGERPRINT }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_FINGERPRINT SSH_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing setting: $name"
              exit 1
            fi
          done
          key_file="$(mktemp)"
          known_hosts="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          chmod 600 "$key_file" "$known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          ssh-keyscan -T 10 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$known_hosts" | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$SSH_FINGERPRINT" ]]; then
            echo 'SSH host fingerprint does not match the independently verified fingerprint.'
            exit 1
          fi
          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'echo SSH_OK'
